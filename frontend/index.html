<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets the `dark` class before first paint. main.ts (and the Pinia
         theme store it initializes) only runs once the bundle has downloaded
         and mounted, which is a visible flash of the light theme for a
         dark-mode user on every load; this has to live here, not in
         src/stores/theme.ts, to run before that. The key must stay
         byte-identical to STORAGE_KEY in that file. Wrapped in try/catch
         because localStorage throws in some private-browsing modes, and that
         must never be the thing that breaks page load. -->
    <script>
      try {
        var storedMode = localStorage.getItem('promptrack-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (storedMode === 'dark' || (storedMode !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <!-- favicon.svg and the rack PNG below are not the same artwork (see
         docs/superpowers/specs/2026-08-14-endpoints-rename-and-global-base-design.md
         section 4's verification note) — the PNG is the current brand mark,
         so it is listed first as the primary icon; the SVG stays as a
         scalable fallback for browsers that pick the first `rel="icon"` they
         support. -->
    <link rel="icon" type="image/png" sizes="128x128" href="/brand/promptrack-mark-128.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptRack</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
