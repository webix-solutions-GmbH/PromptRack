<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets the `dark` class before first paint. main.ts (and the Pinia
         theme store it initializes) only runs once the bundle has downloaded
         and mounted, which is a visible flash of the light theme for a
         dark-mode user on every load; this has to live here, not in
         src/stores/theme.ts, to run before that. The key must stay
         byte-identical to STORAGE_KEY in that file. Wrapped in try/catch
         because localStorage throws in some private-browsing modes, and that
         must never be the thing that breaks page load. -->
    <script>
      try {
        var storedMode = localStorage.getItem('promptrack-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (storedMode === 'dark' || (storedMode !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <!-- Its own 32px file rather than `/logo.png`: the mark's five strokes sit
         a pixel or two apart at this size, and letting the browser downscale
         the big one closes the gaps into a grey block. This copy had the bars
         thinned before the downscale so they stay open. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptRack</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
