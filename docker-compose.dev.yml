# Development database only. Production compose (Task 6.3) is docker-compose.yml.
#
# `name` is pinned rather than left to default: Compose otherwise derives the
# project name from the directory, so the named volume below becomes
# `<dirname>_promptrack-dev-pgdata` and renaming the checkout silently orphans
# the database (this happened once — Webix.AI.Agent-Model-Eval → PromptRack —
# and the next `up` mounted a fresh empty volume). Pinned, the volume keeps its
# name wherever the repo lives.
name: promptrack
services:
  postgres:
    image: postgres:17-alpine
    container_name: promptrack-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: promptrack
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: promptrack
      # UTF8 is mandatory: prompt content can carry Unicode Tags (U+E0000+).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - promptrack-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptrack -d promptrack"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  promptrack-dev-pgdata:
