services:
  postgres:
    image: postgres:17-alpine
    container_name: modelfit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agentval
      # UTF8 is mandatory: seeded prompts carry Unicode Tags (U+E0000+).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentval -d agentval"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - modelfit

  modelfit:
    build: .
    container_name: modelfit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Point this at an external/managed database to bypass the bundled one.
      # `$POSTGRES_PASSWORD` is deliberately unbraced: compose 2.12 cannot parse a
      # nested `${...}` inside a default value and fails the whole file.
      - DATABASE_URL=${DATABASE_URL:-postgres://agentval:$POSTGRES_PASSWORD@postgres:5432/agentval}
      # Session signing key and the public origin — better-auth builds every
      # auth URL, including the OIDC redirect_uri, from BETTER_AUTH_URL. Put
      # both in a .env file next to this one.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-}
      # Optional generic OIDC provider; an empty OIDC_ISSUER disables SSO.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-}
      - OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE:-}
    # Published on localhost only. Change to "0.0.0.0:3100:3000" to expose it on the LAN.
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - modelfit

    # If you front the app with a reverse proxy that runs in its own compose stack, join
    # that stack's network here and reach the app as `modelfit:3000`:
    #
    # networks:
    #   - modelfit
    #   - proxy
    #
    # networks:
    #   proxy:
    #     external: true
    #     name: <the network your proxy stack created>

volumes:
  pgdata:

networks:
  modelfit:
