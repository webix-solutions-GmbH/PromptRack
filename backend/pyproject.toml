[project]
name = "promptrack-backend"
version = "0.3.1"
description = "PromptRack backend: FastAPI + async SQLAlchemy + Alembic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "argon2-cffi>=25.1.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "mcp>=2.0.0",
    # Starlette parses a multipart body through this and nothing else, so the
    # markdown-corpus upload (`POST /api/toolsets/{id}/documents/upload`) needs
    # it. Named explicitly even though `mcp` already pulls it in: as a transitive
    # dependency it would vanish the day `mcp` stopped needing it, and the
    # breakage would surface as an ImportError from a route that has nothing to
    # do with MCP.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, not one per test: the integration
# suite's Postgres engine (backend/tests/integration/conftest.py) is a single
# module-level object built once at import time, and asyncpg connections it
# opens are bound to whichever loop was running when they were created —
# reusing one across pytest-asyncio's default per-function loops raises
# `MissingGreenlet` — the integration suites share one database and one
# client, so they need to run in a single loop. Harmless for the pure suite,
# which has no async tests today.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
# tests/integration/** needs a real Postgres (see its own conftest.py) and
# must stay out of the default `uv run pytest` run, the same split the old
# Node app made between `npm test` and `npm run test:integration`. An
# explicit `pytest tests/integration` still collects it — pytest resolves
# that path directly rather than through this ignore.
addopts = "--ignore=tests/integration"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Without this, ruff's isort treats the local `alembic/` directory (this
# project's migration scripts) as shadowing the third-party `alembic`
# package and misclassifies `import alembic` as first-party.
known-third-party = ["alembic"]
